[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "measure-station"
dynamic = ["version"]
description = "Always-on Raspberry Pi environmental measurement station with store-and-forward MQTT publishing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiomqtt>=2.3,<3",
    "pyserial>=3.5",
]

[project.optional-dependencies]
# Sensor driver libraries are optional, so the package installs (and tests run) anywhere.
bh1750 = ["smbus2>=0.4"]
bmp280 = ["smbus2>=0.4"]
cht8305 = ["smbus2>=0.4"]
ens160_aht21 = ["smbus2>=0.4"]
mcp9808 = ["smbus2>=0.4"]
scd41 = ["smbus2>=0.4"]
sen6x = ["smbus2>=0.4"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
measure-station = "measure_station.main:main"

[tool.setuptools.dynamic]
version = { attr = "measure_station.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Verbatim copies from drivers-repo, kept identical to it (see drivers/__init__.py).
extend-exclude = ["src/measure_station/drivers"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
