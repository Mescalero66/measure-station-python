# Installed to /etc/systemd/system.conf.d/ by deploy/install.sh.
# systemd pets the BCM2835 hardware watchdog (/dev/watchdog). If the kernel or
# systemd itself hangs, the SoC resets and the Pi reboots. 15 s is close to the
# BCM2835's maximum timeout.
[Manager]
RuntimeWatchdogSec=15s
RebootWatchdogSec=2min
